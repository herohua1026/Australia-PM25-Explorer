<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;color:#152c43;background:#eef5f7}#wrap{position:relative;border:1px solid #d6e3e8;border-radius:12px;overflow:hidden;background:#edf5f7}svg{width:100%;height:430px;display:block;touch-action:pan-y}.area{stroke:#748d9c;stroke-width:.25;cursor:pointer;vector-effect:non-scaling-stroke}.area:hover,.area:focus{stroke:#082e3b;stroke-width:2;outline:none}.selected{stroke:#032d39;stroke-width:2.5}.tools{position:absolute;top:16px;left:16px;display:flex;flex-direction:column;gap:4px}button{border:1px solid #ccd9de;background:white;border-radius:6px;width:34px;height:34px;font-size:20px;color:#16434e;cursor:pointer}button:focus-visible{outline:3px solid #167c84}#legend{position:absolute;left:16px;bottom:16px;background:#fffffff2;padding:12px 16px;border-radius:8px;width:245px;font-size:12px}.bar{height:10px;border-radius:4px;margin:8px 0 5px}.labels{display:flex;justify-content:space-between}#tooltip{position:absolute;right:12px;top:12px;background:#fff;padding:10px 14px;box-shadow:0 2px 8px #183c4920;border-radius:8px;max-width:65%;pointer-events:none;font-size:12px}.hint{position:absolute;right:12px;bottom:12px;font-size:11px;color:#526879} @media(max-width:600px){svg{height:330px}#legend{width:200px}.hint{display:none}}
</style></head><body><div id="wrap"><svg id="map" role="img" aria-label="Australian PM2.5 geography map"></svg><div class="tools"><button id="plus" aria-label="Zoom in">+</button><button id="minus" aria-label="Zoom out">−</button><button id="reset" aria-label="Reset map">↺</button><button id="all" aria-label="Show all territories" title="Show all territories">⊞</button></div><div id="tooltip">Select an area to explore its history</div><div id="legend"></div><div class="hint">Click an area · Drag to pan · Simplified 2021 boundaries</div></div>
<script>
const send=(type,extra={})=>window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
let lastSelected=null; let args={},view=[240,115,610,530],drag=null;
const svg=document.getElementById('map'),tip=document.getElementById('tooltip');
const sequential=['#fff2c8','#f5c864','#de8556','#a34777','#54166b'],diverging=['#16627c','#81b5c3','#f3f3ee','#d5a0ac','#922b59'];
function color(v,min,max,div){if(v===null||!Number.isFinite(v))return '#c4cbd0';const colors=div?diverging:sequential;const t=Math.max(0,Math.min(1,(v-min)/(max-min||1)))*(colors.length-1),i=Math.min(colors.length-2,Math.floor(t)),f=t-i;const a=colors[i].match(/\w\w/g).map(x=>parseInt(x,16)),b=colors[i+1].match(/\w\w/g).map(x=>parseInt(x,16));return 'rgb('+a.map((x,j)=>Math.round(x+(b[j]-x)*f)).join(',')+')'}
function setView(){svg.setAttribute('viewBox',view.join(' '))}
function zoom(f){const [x,y,w,h]=view,nw=w*f,nh=h*f;if(nw<80||nw>1900)return;view=[x+(w-nw)/2,y+(h-nh)/2,nw,nh];setView()}
document.getElementById('plus').onclick=()=>zoom(.7);document.getElementById('minus').onclick=()=>zoom(1.4);document.getElementById('reset').onclick=()=>{view=[240,115,610,530];setView()};
document.getElementById('all').onclick=()=>{view=[0,0,950,640];setView()};
svg.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,view:[...view],moved:false}};
window.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;const scale=drag.view[2]/svg.getBoundingClientRect().width;view=[drag.view[0]-dx*scale,drag.view[1]-dy*scale,drag.view[2],drag.view[3]];setView()};
window.onpointerup=()=>{setTimeout(()=>drag=null,0)};
function choose(code){if(drag?.moved)return;send('streamlit:setComponentValue',{value:{code,nonce:Date.now()}})}
window.addEventListener('message',e=>{if(e.source!==window.parent||e.data.type!=='streamlit:render')return;args=e.data.args;if(args.selected!==lastSelected){const feature=args.shapes.features.find(f=>f.code===args.selected);if(feature&&feature.state==='Other Territories')view=[0,0,950,640];lastSelected=args.selected;}svg.replaceChildren();setView();const values=args.values;
 for(const f of args.shapes.features){const v=values[f.code],p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',f.path);p.setAttribute('fill-rule','evenodd');p.setAttribute('fill',color(v,args.min,args.max,args.diverging));p.setAttribute('class','area'+(f.code===args.selected?' selected':''));p.setAttribute('aria-label',f.name+' '+(v===undefined?'No data':v.toFixed(2)+' µg/m³'));p.onclick=()=>choose(f.code);p.onmouseenter=()=>{tip.textContent=f.name+' · '+(v===undefined?'No data':v.toFixed(2)+' µg/m³')};svg.append(p)}
 const legend=document.getElementById('legend');legend.replaceChildren();const title=document.createElement('strong');title.textContent=args.label+' (µg/m³)';legend.append(title);const bar=document.createElement('div');bar.className='bar';bar.style.background='linear-gradient(to right,'+(args.diverging?diverging:sequential).join(',')+')';legend.append(bar);const labels=document.createElement('div');labels.className='labels';for(const v of [args.min,(args.min+args.max)/2,args.max]){const s=document.createElement('span');s.textContent=v.toFixed(1);labels.append(s)}legend.append(labels);const note=document.createElement('div');note.style.marginTop='5px';note.textContent=args.scale_note||'Shared raw / calibrated scale';legend.append(note);send('streamlit:setFrameHeight',{height:window.innerWidth<600?332:432});
});send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:432});
</script></body></html>
